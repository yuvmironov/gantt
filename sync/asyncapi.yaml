asyncapi: 3.0.0
info:
  title: RP Gant Sync WebSocket
  version: 1.1.0
  x-status: implemented
  description: >-
    WebSocket-синхронизация Gantt. Клиент подключается к `/ws?token=<sync-token>`.
    Токен выдаёт `GET /api/v1/sync/token`; project scope берётся из claims токена.
    Subscribe/unsubscribe-сообщения не используются. Сервер отправляет события
    только по проектам, доступным в токене; администратор получает все проекты.
servers:
  production:
    host: sync.rp-gant.ru
    pathname: /ws
    protocol: wss
  local:
    host: sync.rp-gant.localhost
    pathname: /ws
    protocol: wss
channels:
  sync:
    address: /ws
    messages:
      connected:
        $ref: '#/components/messages/Connected'
      diagramChanged:
        $ref: '#/components/messages/DiagramChanged'
      error:
        $ref: '#/components/messages/Error'
      ping:
        $ref: '#/components/messages/Ping'
      pong:
        $ref: '#/components/messages/Pong'
operations:
  clientMessages:
    action: send
    channel:
      $ref: '#/channels/sync'
    messages:
      - $ref: '#/channels/sync/messages/ping'
  serverMessages:
    action: receive
    channel:
      $ref: '#/channels/sync'
    messages:
      - $ref: '#/channels/sync/messages/connected'
      - $ref: '#/channels/sync/messages/diagramChanged'
      - $ref: '#/channels/sync/messages/error'
      - $ref: '#/channels/sync/messages/pong'
components:
  messages:
    Connected:
      name: Connected
      contentType: application/json
      payload:
        $ref: './schemas/connected.schema.json'
    DiagramChanged:
      name: DiagramChanged
      contentType: application/json
      payload:
        $ref: './schemas/diagram-changed.schema.json'
    Error:
      name: Error
      contentType: application/json
      payload:
        $ref: './schemas/error.schema.json'
    Ping:
      name: Ping
      contentType: application/json
      payload:
        $ref: './schemas/ping.schema.json'
    Pong:
      name: Pong
      contentType: application/json
      payload:
        $ref: './schemas/pong.schema.json'
