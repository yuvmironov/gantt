{{- if .Values.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-backup
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.backup.pvc.size }}
  {{- with .Values.backup.pvc.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-postgres-backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: {{ .Values.backup.image }}
              envFrom:
                - secretRef:
                    name: {{ .Values.backup.secretName }}
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  pg_dump "$DATABASE_URL" | gzip > "/backup/{{ .Values.backup.database }}-$(date +%Y%m%d%H%M).sql.gz"
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: {{ .Release.Name }}-backup
{{- end }}
