migrations:
  enabled: true
  image:
    repository: ghcr.io/yuvmironov/rp-gant/db-migrate
    tag: main
    pullPolicy: IfNotPresent
  secretName: platform-database
  userDb: rp_gant_user
  projectDb: rp_gant_project
  notificationDb: rp_gant_notification
  auditDb: rp_gant_audit
  backoffLimit: 3

backup:
  enabled: false
  schedule: "0 2 * * *"
  image: postgres:17-alpine
  secretName: platform-database
  database: rp_gant_user
  pvc:
    size: 20Gi
    storageClassName: ""
