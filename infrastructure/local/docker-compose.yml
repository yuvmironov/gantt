name: ${COMPOSE_PROJECT_NAME:-smart-oati}

services:
  postgres:
    image: postgres:17-alpine
    profiles: ["infra"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smart_oati}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_oati_dev}
      POSTGRES_DB: ${POSTGRES_DB:-smart_oati_user}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart_oati}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [smart-oati]

  redis:
    image: redis:7-alpine
    profiles: ["infra"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [smart-oati]

  kafka:
    image: apache/kafka:3.9.0
    profiles: ["infra"]
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks: [smart-oati]

  kafka-init:
    image: apache/kafka:3.9.0
    profiles: ["infra"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic ${KAFKA_TOPIC:-smartoati.events} \
          --partitions 6 --replication-factor 1
    networks: [smart-oati]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["infra"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    networks: [smart-oati]

  mailpit:
    image: axllent/mailpit:v1.21
    profiles: ["infra"]
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [smart-oati]

  telegram-mock:
    image: wiremock/wiremock:3.9.1
    profiles: ["infra"]
    restart: unless-stopped
    volumes:
      - ./telegram-mock/mappings:/home/wiremock/mappings:ro
    networks: [smart-oati]

  traefik:
    image: traefik:v3.2
    profiles: ["infra"]
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./certs:/certs:ro
    command:
      - "--api.dashboard=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--log.level=INFO"
    networks: [smart-oati]

  api-gateway:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: apps/api-gateway/Dockerfile
    image: smart-oati/api-gateway:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      USER_SERVICE_GRPC: user-service:50051
    networks: [smart-oati]

  user-service:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: apps/user-service/Dockerfile
    image: smart-oati/user-service:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      GRPC_PORT: ${GRPC_PORT:-50051}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL_USER}
      DEV_AUTO_VERIFY: ${DEV_AUTO_VERIFY:-true}
    ports:
      - "${GRPC_PORT:-50051}:${GRPC_PORT:-50051}"
    networks: [smart-oati]

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  smart-oati:
    name: smart-oati
