name: ${COMPOSE_PROJECT_NAME:-rp-gant}

services:
  postgres:
    image: postgres:17-alpine
    profiles: ["infra"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rp_gant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rp_gant_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rp_gant_user}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rp_gant}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [rp-gant]

  redis:
    image: redis:7-alpine
    profiles: ["infra"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [rp-gant]

  kafka:
    image: apache/kafka:3.9.0
    profiles: ["infra"]
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks: [rp-gant]

  kafka-init:
    image: apache/kafka:3.9.0
    profiles: ["infra"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic ${KAFKA_TOPIC:-rp_gant.events} \
          --partitions 6 --replication-factor 1
    networks: [rp-gant]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["infra"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    networks: [rp-gant]

  mailpit:
    image: axllent/mailpit:v1.21
    profiles: ["infra"]
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [rp-gant]

  telegram-mock:
    image: wiremock/wiremock:3.9.1
    profiles: ["infra"]
    restart: unless-stopped
    volumes:
      - ./telegram-mock/mappings:/home/wiremock/mappings:ro
    networks: [rp-gant]

  db-init:
    image: postgres:17-alpine
    profiles: ["infra"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USER_DB: rp_gant_user
      PROJECT_DB: rp_gant_project
      NOTIFICATION_DB: rp_gant_notification
      AUDIT_DB: rp_gant_audit
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-rp_gant}
      PGPASSWORD: ${POSTGRES_PASSWORD:-rp_gant_dev}
    volumes:
      - ../../db:/db:ro
      - ./db-init.sh:/db-init.sh:ro
    entrypoint: ["/bin/sh", "/db-init.sh"]
    networks: [rp-gant]


  traefik:
    image: traefik:v3.2
    profiles: ["infra"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    command:
      - "--api.dashboard=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--log.level=INFO"
    networks: [rp-gant]

  api-gateway:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: apps/api-gateway/Dockerfile
    image: rp-gant/api-gateway:local
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_started
      project-service:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      USER_SERVICE_GRPC: user-service:50051
      PROJECT_SERVICE_GRPC: project-service:50051
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      AUDIT_SERVICE_URL: http://audit-service:8080
      SYNC_TOKEN_SECRET: 
      RATE_LIMIT_MAX: ${SYNC_TOKEN_SECRET:-local-sync-secret}
    networks: [rp-gant]

  sync-service:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: apps/sync-service/Dockerfile
    image: rp-gant/sync-service:local
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-rp_gant.events}
      KAFKA_CONSUMER_GROUP_SYNC: sync
      SYNC_SERVICE_URL: http://127.0.0.1:8080
      SYNC_TOKEN_SECRET: 
      RATE_LIMIT_MAX: ${SYNC_TOKEN_SECRET:-local-sync-secret}
    networks: [rp-gant]

  audit-service:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: apps/audit-service/Dockerfile
    image: rp-gant/audit-service:local
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL_AUDIT}
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-rp_gant.events}
      KAFKA_CONSUMER_GROUP_AUDIT: audit
    networks: [rp-gant]

  notification-service:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: apps/notification-service/Dockerfile
    image: rp-gant/notification-service:local
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      user-service:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL_NOTIFICATION}
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-rp_gant.events}
      KAFKA_CONSUMER_GROUP_NOTIFICATION: notification
      USER_SERVICE_GRPC: user-service:50051
      SMTP_URL: smtp://mailpit:1025
      SMTP_FROM: RP Gant <no-reply@rp-gant.local>
      TELEGRAM_API_URL: http://telegram-mock:8080
      TELEGRAM_BOT_TOKEN: local-test-token
    networks: [rp-gant]

  frontend:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
    image: rp-gant/frontend:local
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [rp-gant]

  user-service:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: apps/user-service/Dockerfile
    image: rp-gant/user-service:local
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "8080"
      GRPC_PORT: ${GRPC_PORT:-50051}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL_USER}
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-rp_gant.events}
      SMTP_URL: smtp://mailpit:1025
      SMTP_FROM: RP Gant <no-reply@rp-gant.local>
      PUBLIC_APP_URL: https://app.rp-gant.localhost
      DEV_AUTO_VERIFY: ${DEV_AUTO_VERIFY:-true}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}
      DEV_ADMIN_LAST_NAME: ${DEV_ADMIN_LAST_NAME:-}
      DEV_ADMIN_FIRST_NAME: ${DEV_ADMIN_FIRST_NAME:-}
      DEV_ADMIN_MIDDLE_NAME: ${DEV_ADMIN_MIDDLE_NAME:-}
    ports:
      - "${GRPC_PORT:-50051}:${GRPC_PORT:-50051}"
    networks: [rp-gant]

  project-service:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: apps/project-service/Dockerfile
    image: rp-gant/project-service:local
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "8080"
      GRPC_PORT: "50051"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL_PROJECT}
      USER_SERVICE_GRPC: user-service:50051
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-rp_gant.events}
    networks: [rp-gant]

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [rp-gant]

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks: [rp-gant]

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:

networks:
  rp-gant:
    name: rp-gant
