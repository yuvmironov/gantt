name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level high

  security-required:
    if: always()
    needs: [codeql, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Check security jobs
        run: |
          if [ "${{ needs.codeql.result }}" != "success" ]; then
            echo "codeql failed"
            exit 1
          fi
          if [ "${{ needs.audit.result }}" != "success" ]; then
            echo "audit failed"
            exit 1
          fi
          echo "security ok"
