syntax = "proto3";

package smartoati.events.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

message EventEnvelope {
  string event_id = 1;
  string event_type = 2;
  int32 schema_version = 3;
  google.protobuf.Timestamp occurred_at = 4;
  string source_service = 5;
  string actor_user_id = 6;
  repeated string actor_roles = 7;
  string project_id = 8;
  string diagram_id = 9;
  string entity_type = 10;
  string entity_id = 11;
  google.protobuf.Struct payload = 12;
  string request_id = 13;
  string correlation_id = 14;
}

message DiagramChangedPayload {
  string diagram_id = 1;
  int64 revision = 2;
  string entity_type = 3;
  string entity_id = 4;
  string operation = 5;
  google.protobuf.Struct data = 6;
}

message AuthEmailRequestedPayload {
  string job_id = 1;
  string user_id = 2;
  string invitation_id = 3;
  string recipient_email = 4;
  string template_code = 5;
  google.protobuf.Struct variables = 6;
  string locale = 7;
}

message NotificationEventPayload {
  string notification_id = 1;
  string recipient_user_id = 2;
  string project_id = 3;
  string diagram_id = 4;
  string event_type = 5;
  string channel = 6;
  string status = 7;
  string error_code = 8;
  string provider_message_id = 9;
}
