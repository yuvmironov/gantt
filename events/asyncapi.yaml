asyncapi: 3.0.0
info:
  title: RP Gant Event Bus
  version: 1.0.0
  description: Контракт событий между backend-сервисами RP Gant. Брокер не фиксируется.
channels:
  events:
    address: rp_gant.events
    messages:
      event:
        $ref: '#/components/messages/EventEnvelope'
operations:
  publishEvent:
    action: send
    channel:
      $ref: '#/channels/events'
  consumeEvent:
    action: receive
    channel:
      $ref: '#/channels/events'
components:
  messages:
    EventEnvelope:
      name: EventEnvelope
      contentType: application/json
      payload:
        $ref: './schemas/event-envelope.schema.json'
